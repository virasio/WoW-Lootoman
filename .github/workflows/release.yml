# Packages the addon with the BigWigs packager.
# A pushed tag builds the package and uploads it to CurseForge, Wago and
# GitHub Releases; a tag containing "alpha" becomes an alpha file.
# A manual run only builds the package and attaches the zip to the run.
#
# Repository secrets: CF_API_TOKEN (CurseForge) and, optionally,
# WAGO_API_TOKEN (Wago). The TOC needs ## X-Curse-Project-ID (and ## X-Wago-ID
# for Wago) before the first upload. GitHub Releases use the workflow's own
# token.
name: Release

on:
  push:
    tags: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history, for the changelog.
          fetch-depth: 0

      - name: Package and upload
        if: github.event_name == 'push'
        uses: BigWigsMods/packager@v2
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package only
        if: github.event_name == 'workflow_dispatch'
        uses: BigWigsMods/packager@v2
        with:
          args: -d

      - name: Attach the package
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: Lootoman
          path: .release/*.zip
          # .release/ is a hidden folder, which the action skips by default.
          # The path matches only the package zip.
          include-hidden-files: true
