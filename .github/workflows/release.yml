# Packages the addon with the BigWigs packager.
# A pushed tag publishes only once it has proven itself a release: its commit
# is on main, the changelog starts with its entry and the TOC leaves the
# version to the packager (.github/scripts/verify-release.sh), and the checks
# pass (check.yml). Then the package is built and uploaded to CurseForge, Wago
# and GitHub Releases; a tag containing "alpha" becomes an alpha file.
# A manual run only builds the package and attaches the zip to the run.
#
# Repository secrets: CF_API_TOKEN (CurseForge) and, optionally,
# WAGO_API_TOKEN (Wago). The TOC needs ## X-Curse-Project-ID (and ## X-Wago-ID
# for Wago) before the first upload. GitHub Releases use the workflow's own
# token, passed as GITHUB_API_TOKEN: the packager's v2 release reads that name
# (or the older GITHUB_OAUTH), not GH_API_TOKEN, which only newer versions read.
#
# Every action is pinned to a commit, its version in the comment.
name: Release

on:
  push:
    tags: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: The tag is a release of main
        run: bash .github/scripts/verify-release.sh "$GITHUB_REF_NAME"

  check:
    if: github.event_name == 'push'
    uses: ./.github/workflows/check.yml

  release:
    needs: [verify, check]
    # A tag goes on only when both passed; the manual run has neither.
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || (needs.verify.result == 'success' && needs.check.result == 'success')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, for the changelog.
          fetch-depth: 0

      - name: Package and upload
        if: github.event_name == 'push'
        uses: BigWigsMods/packager@01e8631a69c69d7654c788d152630d5fed9e3812 # v2.7.0
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
          GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package only
        if: github.event_name == 'workflow_dispatch'
        uses: BigWigsMods/packager@01e8631a69c69d7654c788d152630d5fed9e3812 # v2.7.0
        with:
          args: -d

      - name: Attach the package
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Lootoman
          path: .release/*.zip
          # .release/ is a hidden folder, which the action skips by default.
          # The path matches only the package zip.
          include-hidden-files: true
